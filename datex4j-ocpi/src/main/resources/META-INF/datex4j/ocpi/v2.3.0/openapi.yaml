      description: Result from the EVSE on a charging profile request.
      x-enumDescriptions:
        ACCEPTED: ChargingProfile request accepted by the EVSE.
        REJECTED: ChargingProfile request rejected by the EVSE.
        UNKNOWN: No Charging Profile(s) were found by the EVSE matching the request.
    ChargingRateUnit:
      type: string
      enum:
        - W
        - A
      description: "Unit of measure for charging rate: W (Watts) or A (Amperes per phase)."
      x-enumDescriptions:
        W: Watts (power). This is the total allowed charging power. It is usually more
          convenient to use this for DC charging.
        A: Amperes (current). The amount of Ampere per phase, not the sum of all phases.
          It is usually more convenient to use this for AC charging.
