      description: Echoed from the request. Same correlation ID.
      schema:
        type: string
    OCPI-from-country-code:
      description: ISO-3166 alpha-2 country code of the party this response is sent from.
      schema:
        type: string
        minLength: 2
        maxLength: 2
    OCPI-from-party-id:
      description: Party ID of the party this response is sent from.
      schema:
        type: string
        minLength: 3
        maxLength: 3
    OCPI-to-country-code:
      description: ISO-3166 alpha-2 country code of the party this response is sent to.
      schema:
        type: string
        minLength: 2
        maxLength: 2
    OCPI-to-party-id:
      description: Party ID of the party this response is sent to.
      schema:
        type: string
        minLength: 3
        maxLength: 3
    X-Total-Count:
      description: The total number of objects available in the server system that
        match the given query (including query parameters such as date_from and
        date_to but excluding limit and offset).
      schema:
        type: integer
      required: false
    X-Limit:
      description: The maximum number of objects that the server can return. This is
        an upper limit; fewer objects may be returned if not enough remain.
      schema:
        type: integer
      required: false
    Link:
      description: "Link to the 'next' page. Provided when this is NOT the last page.
        Contains any filters present in the original request. Format: <URL>;
        rel=\"next\""
      schema:
        type: string
      required: false
