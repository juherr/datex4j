    CommandType:
      anyOf:
        - type: string
          enum:
            - CANCEL_RESERVATION
            - RESERVE_NOW
            - START_SESSION
            - STOP_SESSION
            - UNLOCK_CONNECTOR
        - type: string
      description: Open command type. Parties may agree on additional command values.
      x-enumDescriptions:
        CANCEL_RESERVATION: Request the Charge Point to cancel a specific reservation.
        RESERVE_NOW: Request the Charge Point to reserve a specific EVSE for a Token for
          a certain time, starting now.
        START_SESSION: Request the Charge Point to start a transaction on the given EVSE
          or Connector.
        STOP_SESSION: Request the Charge Point to stop an ongoing session.
        UNLOCK_CONNECTOR: Request the Charge Point to unlock the connector, if applicable.
    CommandResponseType:
      type: string
      enum:
        - NOT_SUPPORTED
        - REJECTED
        - ACCEPTED
        - UNKNOWN_SESSION
      description: Response from the CPO on the command request.
      x-enumDescriptions:
        NOT_SUPPORTED: The requested command is not supported by this CPO, Charge Point,
          EVSE etc.
        REJECTED: Command request rejected by the CPO. (Session might not be from a
          customer of the eMSP that sent this request)
        ACCEPTED: Command request accepted by the CPO.
        UNKNOWN_SESSION: The Session in the requested command is not known by this CPO.
    CommandResponse:
      type: object
      description: Immediate response from CPO indicating whether the command was
        understood and forwarded (not the result from the Charge Point itself).
      required:
        - result
        - timeout
      properties:
        result:
          $ref: "#/components/schemas/CommandResponseType"
        timeout:
          type: integer
          description: Timeout in seconds for waiting for the async CommandResult.
        message:
          type: array
          items:
            $ref: "#/components/schemas/DisplayText"
          description: Human-readable description of the result.
      additionalProperties: true
    CommandEnvelopeResponse:
      type: object
      required:
        - status_code
        - timestamp
        - data
      properties:
        data:
          $ref: "#/components/schemas/CommandResponse"
        status_code:
          type: integer
          description: OCPI status code (1xxx=success, 2xxx=client error, 3xxx=server
            error, 4xxx=hub error).
          example: 1000
        status_message:
          type: string
          description: An optional status message which may help when debugging.
        timestamp:
          $ref: "#/components/schemas/DateTime"
      additionalProperties: true
    CancelReservation:
      type: object
      description: Request to cancel a reservation.
      required:
        - response_url
        - reservation_id
      properties:
        response_url:
          type: string
          format: uri
          maxLength: 255
          description: URL that the CommandResult POST should be sent to.
        reservation_id:
          type: string
          maxLength: 36
          description: Unique reservation ID to cancel.
      additionalProperties: true
    CommandResultType:
      type: string
      enum:
        - ACCEPTED
        - CANCELED_RESERVATION
        - EVSE_OCCUPIED
        - EVSE_INOPERATIVE
        - FAILED
        - NOT_SUPPORTED
        - REJECTED
        - TIMEOUT
        - UNKNOWN_RESERVATION
      description: Result of the command as reported by the Charge Point.
      x-enumDescriptions:
        ACCEPTED: Command request accepted by the Charge Point.
        CANCELED_RESERVATION: The Reservation has been canceled by the CPO.
        EVSE_OCCUPIED: EVSE is currently occupied, another session is ongoing. Cannot
          start a new session.
        EVSE_INOPERATIVE: EVSE is currently inoperative or faulted.
        FAILED: Execution of the command failed at the Charge Point.
        NOT_SUPPORTED: The requested command is not supported by this Charge Point, EVSE etc.
        REJECTED: Command request rejected by the Charge Point.
        TIMEOUT: Command request timeout, no response received from the Charge Point in
          a reasonable time.
        UNKNOWN_RESERVATION: The Reservation in the requested command is not known by
          this Charge Point.
    CommandResult:
      type: object
      description: Asynchronous result from the Charge Point, sent via POST to the
        response_url.
      required:
        - result
      properties:
        result:
          $ref: "#/components/schemas/CommandResultType"
        message:
          type: array
          items:
            $ref: "#/components/schemas/DisplayText"
          description: Human-readable description of the result.
      additionalProperties: true
    WhitelistType:
      type: string
      enum:
        - ALWAYS
        - ALLOWED
        - ALLOWED_OFFLINE
        - NEVER
      description: Defines the whitelist behavior for a Token.
      x-enumDescriptions:
        ALWAYS: Token always has to be whitelisted, realtime authorization is not
          possible/allowed. CPO shall always allow any use of this Token.
        ALLOWED: It is allowed to whitelist the token, realtime authorization is also
          allowed. The CPO may choose which version of authorization to use.
        ALLOWED_OFFLINE: In normal situations realtime authorization shall be used. But
          when the CPO cannot get a response from the eMSP (communication
          between CPO and eMSP is offline), the CPO shall allow this Token to be
          used.
        NEVER: Whitelisting is forbidden, only realtime authorization is allowed. CPO
          shall always send a realtime authorization for any use of this Token
          to the eMSP.
    ProfileType:
      type: string
      enum:
        - CHEAP
        - FAST
        - GREEN
        - REGULAR
      description: Type of smart charging profile selected by the driver.
      x-enumDescriptions:
        CHEAP: Driver wants to use the cheapest charging profile possible.
        FAST: Driver wants his EV charged as quickly as possible and is willing to pay a
          premium for this, if needed.
        GREEN: Driver wants his EV charged with as much regenerative (green) energy as
          possible.
        REGULAR: Driver does not have special preferences.
