openapi: 3.1.0
info:
  title: OCPI 2.3.0 Edition 2 Core API
  version: 2.3.0
  license:
    name: Creative Commons Attribution-NoDerivatives 4.0 International
    url: https://creativecommons.org/licenses/by-nd/4.0/
  description: Aggregated OpenAPI description for the OCPI 2.3.0 Edition 2 core
    specification.
  x-ocpi-edition: 2
security:
  - TokenAuth: []
externalDocs:
  description: OCPI 2.3.0 Edition 2 core specification
  url: https://github.com/ocpi/ocpi/tree/2.3.0/release/core
paths:
  /cdrs:
    parameters:
      - $ref: "#/components/parameters/X-Request-ID"
      - $ref: "#/components/parameters/X-Correlation-ID"
      - $ref: "#/components/parameters/OCPI-from-country-code"
      - $ref: "#/components/parameters/OCPI-from-party-id"
      - $ref: "#/components/parameters/OCPI-to-country-code"
      - $ref: "#/components/parameters/OCPI-to-party-id"
    get:
      operationId: getCdrs
      summary: Get CDRs List (Sender)
      description: Fetch CDR objects from the CPO, last updated between date_from and
        date_to (paginated).
      tags:
        - CDRs - Sender
      parameters:
        - $ref: "#/components/parameters/date_from"
        - $ref: "#/components/parameters/date_to"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: List of CDR objects.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            X-Correlation-ID:
              $ref: "#/components/headers/X-Correlation-ID"
            OCPI-from-country-code:
              $ref: "#/components/headers/OCPI-from-country-code"
            OCPI-from-party-id:
              $ref: "#/components/headers/OCPI-from-party-id"
            OCPI-to-country-code:
              $ref: "#/components/headers/OCPI-to-country-code"
            OCPI-to-party-id:
              $ref: "#/components/headers/OCPI-to-party-id"
            X-Total-Count:
              $ref: "#/components/headers/X-Total-Count"
            X-Limit:
              $ref: "#/components/headers/X-Limit"
            Link:
              $ref: "#/components/headers/Link"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CDRListResponse"
        "400":
          $ref: "#/components/responses/OcpiBadRequestResponse"
        "401":
          $ref: "#/components/responses/OcpiUnauthorizedResponse"
    post:
      operationId: postReceiverCdr
      summary: Create CDR (Receiver)
      description: Create a new CDR in the eMSP's system. The response SHALL contain a
        Location header with the URL to the newly created CDR.
      tags:
        - CDRs - Receiver
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CDR"
      responses:
        "201":
          description: CDR created. Location header contains URL to the new CDR.
          headers:
            Location:
              description: URL to the newly created CDR object.
              schema:
                type: string
                format: uri
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            X-Correlation-ID:
              $ref: "#/components/headers/X-Correlation-ID"
            OCPI-from-country-code:
              $ref: "#/components/headers/OCPI-from-country-code"
            OCPI-from-party-id:
              $ref: "#/components/headers/OCPI-from-party-id"
            OCPI-to-country-code:
              $ref: "#/components/headers/OCPI-to-country-code"
            OCPI-to-party-id:
              $ref: "#/components/headers/OCPI-to-party-id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OcpiResponse"
        "400":
          $ref: "#/components/responses/OcpiBadRequestResponse"
        "401":
          $ref: "#/components/responses/OcpiUnauthorizedResponse"
  /cdrs/{cdr_id}:
    parameters:
      - $ref: "#/components/parameters/X-Request-ID"
      - $ref: "#/components/parameters/X-Correlation-ID"
      - $ref: "#/components/parameters/OCPI-from-country-code"
      - $ref: "#/components/parameters/OCPI-from-party-id"
      - $ref: "#/components/parameters/OCPI-to-country-code"
      - $ref: "#/components/parameters/OCPI-to-party-id"
    get:
      operationId: getReceiverCdr
      summary: Get CDR (Receiver)
      description: Retrieve an existing CDR from the eMSP's system. The URL is
        provided by the eMSP in the Location header of the POST response.
      tags:
        - CDRs - Receiver
      parameters:
        - name: cdr_id
          in: path
          required: true
          description: ID of the CDR (as returned in the Location header).
          schema:
            type: string
      responses:
        "200":
          description: The requested CDR object.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            X-Correlation-ID:
              $ref: "#/components/headers/X-Correlation-ID"
            OCPI-from-country-code:
              $ref: "#/components/headers/OCPI-from-country-code"
            OCPI-from-party-id:
              $ref: "#/components/headers/OCPI-from-party-id"
            OCPI-to-country-code:
              $ref: "#/components/headers/OCPI-to-country-code"
            OCPI-to-party-id:
              $ref: "#/components/headers/OCPI-to-party-id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CDRResponse"
        "400":
          $ref: "#/components/responses/OcpiBadRequestResponse"
        "401":
          $ref: "#/components/responses/OcpiUnauthorizedResponse"
        "404":
          $ref: "#/components/responses/OcpiNotFoundResponse"
  /chargingprofiles/{session_id}:
    get:
      operationId: getChargingProfile
      summary: Get Active Charging Profile (Receiver)
      description: Request the active charging profile for a session. The result is
        sent asynchronously to the response_url.
      tags:
        - ChargingProfiles - Receiver
      parameters:
        - name: session_id
          in: path
          required: true
          description: The unique id that identifies the session.
          schema:
            type: string
            maxLength: 36
        - name: duration
          in: query
          required: true
          description: Length of the requested ActiveChargingProfile in seconds.
          schema:
            type: integer
        - name: response_url
          in: query
          required: true
          description: URL that the ActiveChargingProfileResult POST should be sent to.
          schema:
            type: string
            format: uri
      responses:
        "200":
          description: Request acknowledged.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            X-Correlation-ID:
              $ref: "#/components/headers/X-Correlation-ID"
            OCPI-from-country-code:
              $ref: "#/components/headers/OCPI-from-country-code"
            OCPI-from-party-id:
              $ref: "#/components/headers/OCPI-from-party-id"
            OCPI-to-country-code:
              $ref: "#/components/headers/OCPI-to-country-code"
            OCPI-to-party-id:
              $ref: "#/components/headers/OCPI-to-party-id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChargingProfileEnvelopeResponse"
        "400":
          $ref: "#/components/responses/OcpiBadRequestResponse"
        "401":
          $ref: "#/components/responses/OcpiUnauthorizedResponse"
      callbacks:
        activeChargingProfileResult:
          "{$request.query.response_url}":
            post:
              summary: Async ActiveChargingProfile result
              description: CPO sends the active charging profile result to the Sender's
                response_url.
              parameters:
                - $ref: "#/components/parameters/X-Request-ID"
                - $ref: "#/components/parameters/X-Correlation-ID"
                - $ref: "#/components/parameters/OCPI-from-country-code"
                - $ref: "#/components/parameters/OCPI-from-party-id"
                - $ref: "#/components/parameters/OCPI-to-country-code"
                - $ref: "#/components/parameters/OCPI-to-party-id"
              security:
                - TokenAuth: []
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: "#/components/schemas/ActiveChargingProfileResult"
              responses:
                "200":
                  description: Result received.
                  headers:
                    X-Request-ID:
                      $ref: "#/components/headers/X-Request-ID"
                    X-Correlation-ID:
                      $ref: "#/components/headers/X-Correlation-ID"
                    OCPI-from-country-code:
                      $ref: "#/components/headers/OCPI-from-country-code"
                    OCPI-from-party-id:
                      $ref: "#/components/headers/OCPI-from-party-id"
                    OCPI-to-country-code:
                      $ref: "#/components/headers/OCPI-to-country-code"
                    OCPI-to-party-id:
                      $ref: "#/components/headers/OCPI-to-party-id"
                  content:
                    application/json:
                      schema:
                        $ref: "#/components/schemas/OcpiResponse"
                "400":
                  $ref: "#/components/responses/OcpiBadRequestResponse"
                "401":
                  $ref: "#/components/responses/OcpiUnauthorizedResponse"
    put:
      operationId: putChargingProfile
      summary: Set Charging Profile (Receiver)
      description: Set or update a charging profile for a session. The result is sent
        asynchronously to the response_url in the request body.
      tags:
        - ChargingProfiles - Receiver
      parameters:
        - name: session_id
          in: path
          required: true
          description: The unique id that identifies the session.
          schema:
            type: string
            maxLength: 36
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetChargingProfile"
      responses:
        "200":
          description: Request acknowledged.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            X-Correlation-ID:
              $ref: "#/components/headers/X-Correlation-ID"
            OCPI-from-country-code:
              $ref: "#/components/headers/OCPI-from-country-code"
            OCPI-from-party-id:
              $ref: "#/components/headers/OCPI-from-party-id"
            OCPI-to-country-code:
              $ref: "#/components/headers/OCPI-to-country-code"
            OCPI-to-party-id:
              $ref: "#/components/headers/OCPI-to-party-id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChargingProfileEnvelopeResponse"
        "400":
          $ref: "#/components/responses/OcpiBadRequestResponse"
        "401":
          $ref: "#/components/responses/OcpiUnauthorizedResponse"
      callbacks:
        chargingProfileResult:
          "{$request.body#/response_url}":
            post:
              summary: Async ChargingProfile result
              description: CPO sends the charging profile result to the Sender's response_url.
              parameters:
                - $ref: "#/components/parameters/X-Request-ID"
                - $ref: "#/components/parameters/X-Correlation-ID"
                - $ref: "#/components/parameters/OCPI-from-country-code"
                - $ref: "#/components/parameters/OCPI-from-party-id"
                - $ref: "#/components/parameters/OCPI-to-country-code"
                - $ref: "#/components/parameters/OCPI-to-party-id"
              security:
                - TokenAuth: []
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: "#/components/schemas/ChargingProfileResult"
              responses:
                "200":
                  description: Result received.
                  headers:
                    X-Request-ID:
                      $ref: "#/components/headers/X-Request-ID"
                    X-Correlation-ID:
                      $ref: "#/components/headers/X-Correlation-ID"
                    OCPI-from-country-code:
                      $ref: "#/components/headers/OCPI-from-country-code"
                    OCPI-from-party-id:
                      $ref: "#/components/headers/OCPI-from-party-id"
                    OCPI-to-country-code:
                      $ref: "#/components/headers/OCPI-to-country-code"
                    OCPI-to-party-id:
                      $ref: "#/components/headers/OCPI-to-party-id"
                  content:
                    application/json:
                      schema:
                        $ref: "#/components/schemas/OcpiResponse"
                "400":
                  $ref: "#/components/responses/OcpiBadRequestResponse"
                "401":
                  $ref: "#/components/responses/OcpiUnauthorizedResponse"
    delete:
      operationId: deleteChargingProfile
      summary: Clear Charging Profile (Receiver)
      description: Clear/remove the charging profile for a session. The result is sent
        asynchronously to the response_url.
      tags:
        - ChargingProfiles - Receiver
      parameters:
        - name: session_id
          in: path
          required: true
          description: The unique id that identifies the session.
          schema:
            type: string
            maxLength: 36
        - name: response_url
          in: query
          required: true
          description: URL that the ClearProfileResult POST should be sent to.
          schema:
            type: string
            format: uri
      responses:
        "200":
          description: Request acknowledged.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            X-Correlation-ID:
              $ref: "#/components/headers/X-Correlation-ID"
            OCPI-from-country-code:
              $ref: "#/components/headers/OCPI-from-country-code"
            OCPI-from-party-id:
              $ref: "#/components/headers/OCPI-from-party-id"
            OCPI-to-country-code:
              $ref: "#/components/headers/OCPI-to-country-code"
            OCPI-to-party-id:
              $ref: "#/components/headers/OCPI-to-party-id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChargingProfileEnvelopeResponse"
        "400":
          $ref: "#/components/responses/OcpiBadRequestResponse"
        "401":
          $ref: "#/components/responses/OcpiUnauthorizedResponse"
      callbacks:
        clearProfileResult:
          "{$request.query.response_url}":
            post:
              summary: Async ClearProfile result
              description: CPO sends the clear profile result to the Sender's response_url.
              parameters:
                - $ref: "#/components/parameters/X-Request-ID"
                - $ref: "#/components/parameters/X-Correlation-ID"
                - $ref: "#/components/parameters/OCPI-from-country-code"
                - $ref: "#/components/parameters/OCPI-from-party-id"
                - $ref: "#/components/parameters/OCPI-to-country-code"
                - $ref: "#/components/parameters/OCPI-to-party-id"
              security:
                - TokenAuth: []
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: "#/components/schemas/ClearProfileResult"
              responses:
                "200":
                  description: Result received.
                  headers:
                    X-Request-ID:
                      $ref: "#/components/headers/X-Request-ID"
                    X-Correlation-ID:
                      $ref: "#/components/headers/X-Correlation-ID"
                    OCPI-from-country-code:
                      $ref: "#/components/headers/OCPI-from-country-code"
                    OCPI-from-party-id:
                      $ref: "#/components/headers/OCPI-from-party-id"
                    OCPI-to-country-code:
                      $ref: "#/components/headers/OCPI-to-country-code"
                    OCPI-to-party-id:
                      $ref: "#/components/headers/OCPI-to-party-id"
                  content:
                    application/json:
                      schema:
                        $ref: "#/components/schemas/OcpiResponse"
                "400":
                  $ref: "#/components/responses/OcpiBadRequestResponse"
                "401":
                  $ref: "#/components/responses/OcpiUnauthorizedResponse"
    parameters:
      - $ref: "#/components/parameters/X-Request-ID"
      - $ref: "#/components/parameters/X-Correlation-ID"
      - $ref: "#/components/parameters/OCPI-from-country-code"
      - $ref: "#/components/parameters/OCPI-from-party-id"
      - $ref: "#/components/parameters/OCPI-to-country-code"
      - $ref: "#/components/parameters/OCPI-to-party-id"
  /chargingprofiles/{session_id}/activeprofile:
    put:
      operationId: putSenderActiveChargingProfile
      summary: Update Active Charging Profile (Sender)
      description: CPO pushes an updated ActiveChargingProfile to the Sender when
        changes occur that influence the profile for an ongoing session. Only
        sent after the Sender has at least once successfully called the Receiver
        PUT interface for the session.
      tags:
        - ChargingProfiles - Sender
      parameters:
        - name: session_id
          in: path
          required: true
          description: The unique id that identifies the session.
          schema:
            type: string
            maxLength: 36
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActiveChargingProfile"
      responses:
        "200":
          description: Active profile update received.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            X-Correlation-ID:
              $ref: "#/components/headers/X-Correlation-ID"
            OCPI-from-country-code:
              $ref: "#/components/headers/OCPI-from-country-code"
            OCPI-from-party-id:
              $ref: "#/components/headers/OCPI-from-party-id"
            OCPI-to-country-code:
              $ref: "#/components/headers/OCPI-to-country-code"
            OCPI-to-party-id:
              $ref: "#/components/headers/OCPI-to-party-id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OcpiResponse"
        "400":
          $ref: "#/components/responses/OcpiBadRequestResponse"
        "401":
          $ref: "#/components/responses/OcpiUnauthorizedResponse"
    parameters:
      - $ref: "#/components/parameters/X-Request-ID"
      - $ref: "#/components/parameters/X-Correlation-ID"
      - $ref: "#/components/parameters/OCPI-from-country-code"
      - $ref: "#/components/parameters/OCPI-from-party-id"
      - $ref: "#/components/parameters/OCPI-to-country-code"
      - $ref: "#/components/parameters/OCPI-to-party-id"
  /commands/{command}:
    post:
      operationId: postExtendedCommand
      summary: Send an extended command (Receiver)
      description: Send a custom command identified by an extended CommandType value.
        The five standard commands remain documented on their literal paths with
        their specific request schemas.
      tags:
        - Commands - Receiver
      parameters:
        - name: command
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/CommandType"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Payload defined by the parties that agreed on the extended command.
      responses:
        "200":
          description: Command acknowledged by CPO.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            X-Correlation-ID:
              $ref: "#/components/headers/X-Correlation-ID"
            OCPI-from-country-code:
              $ref: "#/components/headers/OCPI-from-country-code"
            OCPI-from-party-id:
              $ref: "#/components/headers/OCPI-from-party-id"
            OCPI-to-country-code:
              $ref: "#/components/headers/OCPI-to-country-code"
            OCPI-to-party-id:
              $ref: "#/components/headers/OCPI-to-party-id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandEnvelopeResponse"
        "400":
          $ref: "#/components/responses/OcpiBadRequestResponse"
        "401":
          $ref: "#/components/responses/OcpiUnauthorizedResponse"
    parameters:
      - $ref: "#/components/parameters/X-Request-ID"
      - $ref: "#/components/parameters/X-Correlation-ID"
      - $ref: "#/components/parameters/OCPI-from-country-code"
      - $ref: "#/components/parameters/OCPI-from-party-id"
      - $ref: "#/components/parameters/OCPI-to-country-code"
      - $ref: "#/components/parameters/OCPI-to-party-id"
  /commands/CANCEL_RESERVATION:
    post:
      operationId: postCancelReservation
      summary: Cancel Reservation (Receiver)
      description: Request the Charge Point to cancel a specific reservation.
      tags:
        - Commands - Receiver
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelReservation"
      responses:
        "200":
          description: Command acknowledged by CPO.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            X-Correlation-ID:
              $ref: "#/components/headers/X-Correlation-ID"
            OCPI-from-country-code:
              $ref: "#/components/headers/OCPI-from-country-code"
            OCPI-from-party-id:
              $ref: "#/components/headers/OCPI-from-party-id"
            OCPI-to-country-code:
              $ref: "#/components/headers/OCPI-to-country-code"
            OCPI-to-party-id:
              $ref: "#/components/headers/OCPI-to-party-id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandEnvelopeResponse"
        "400":
          $ref: "#/components/responses/OcpiBadRequestResponse"
        "401":
          $ref: "#/components/responses/OcpiUnauthorizedResponse"
      callbacks:
        commandResult:
          "{$request.body#/response_url}":
            post:
              summary: Async result from Charge Point
              description: The CPO sends the actual result from the Charge Point to the eMSP's
                response_url.
              parameters:
                - $ref: "#/components/parameters/X-Request-ID"
                - $ref: "#/components/parameters/X-Correlation-ID"
                - $ref: "#/components/parameters/OCPI-from-country-code"
                - $ref: "#/components/parameters/OCPI-from-party-id"
                - $ref: "#/components/parameters/OCPI-to-country-code"
                - $ref: "#/components/parameters/OCPI-to-party-id"
              security:
                - TokenAuth: []
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: "#/components/schemas/CommandResult"
              responses:
                "200":
                  description: Result received.
                  headers:
                    X-Request-ID:
                      $ref: "#/components/headers/X-Request-ID"
                    X-Correlation-ID:
                      $ref: "#/components/headers/X-Correlation-ID"
                    OCPI-from-country-code:
                      $ref: "#/components/headers/OCPI-from-country-code"
                    OCPI-from-party-id:
                      $ref: "#/components/headers/OCPI-from-party-id"
                    OCPI-to-country-code:
                      $ref: "#/components/headers/OCPI-to-country-code"
                    OCPI-to-party-id:
                      $ref: "#/components/headers/OCPI-to-party-id"
                  content:
                    application/json:
                      schema:
                        $ref: "#/components/schemas/OcpiResponse"
                "400":
                  $ref: "#/components/responses/OcpiBadRequestResponse"
                "401":
                  $ref: "#/components/responses/OcpiUnauthorizedResponse"
    parameters:
      - $ref: "#/components/parameters/X-Request-ID"
      - $ref: "#/components/parameters/X-Correlation-ID"
      - $ref: "#/components/parameters/OCPI-from-country-code"
      - $ref: "#/components/parameters/OCPI-from-party-id"
      - $ref: "#/components/parameters/OCPI-to-country-code"
      - $ref: "#/components/parameters/OCPI-to-party-id"
  /commands/RESERVE_NOW:
    post:
      operationId: postReserveNow
      summary: Reserve Now (Receiver)
      description: Request the Charge Point to reserve an EVSE for a Token.
      tags:
        - Commands - Receiver
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReserveNow"
      responses:
        "200":
          description: Command acknowledged by CPO.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            X-Correlation-ID:
              $ref: "#/components/headers/X-Correlation-ID"
            OCPI-from-country-code:
              $ref: "#/components/headers/OCPI-from-country-code"
            OCPI-from-party-id:
              $ref: "#/components/headers/OCPI-from-party-id"
            OCPI-to-country-code:
              $ref: "#/components/headers/OCPI-to-country-code"
            OCPI-to-party-id:
              $ref: "#/components/headers/OCPI-to-party-id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandEnvelopeResponse"
        "400":
          $ref: "#/components/responses/OcpiBadRequestResponse"
        "401":
          $ref: "#/components/responses/OcpiUnauthorizedResponse"
      callbacks:
        commandResult:
          "{$request.body#/response_url}":
            post:
              summary: Async result from Charge Point
              parameters:
                - $ref: "#/components/parameters/X-Request-ID"
                - $ref: "#/components/parameters/X-Correlation-ID"
                - $ref: "#/components/parameters/OCPI-from-country-code"
                - $ref: "#/components/parameters/OCPI-from-party-id"
