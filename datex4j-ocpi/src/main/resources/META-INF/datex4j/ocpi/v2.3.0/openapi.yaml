    SessionStatus:
      type: string
      enum:
        - ACTIVE
        - COMPLETED
        - INVALID
        - PENDING
        - RESERVATION
      description: The status of a charging session.
      x-enumDescriptions:
        ACTIVE: "The session has been accepted and is active. All pre-conditions were
          met: Communication between EV and EVSE (for example: cable plugged in
          correctly), EV or driver is authorized. EV is being charged, or can be
          charged. Energy is, or is not, being transfered."
        COMPLETED: The session has been finished successfully. No more modifications
          will be made to the Session object using this state.
        INVALID: The Session object using this state is declared invalid and will not be
          billed.
        PENDING: The session is pending, it has not yet started. Not all pre-conditions
          are met. This is the initial state. The session might never become an
          active session.
        RESERVATION: The session is started due to a reservation, charging has not yet
          started. The session might never become an active session.
    Session:
      type: object
      description: Describes one charging session. Does not require energy transfer.
      required:
        - country_code
        - party_id
        - id
        - start_date_time
