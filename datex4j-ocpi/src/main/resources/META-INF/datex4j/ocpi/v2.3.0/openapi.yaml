          $ref: "#/components/responses/OcpiBadRequestResponse"
        "401":
          $ref: "#/components/responses/OcpiUnauthorizedResponse"
  /tokens/{token_uid}/authorize:
    post:
      operationId: postTokenAuthorize
      summary: Real-time Authorization (Sender)
      description: Perform a real-time authorization request to the eMSP, validating
        if a Token may be used at the optionally given Location.
      tags:
        - Tokens - Sender
      parameters:
        - name: token_uid
          in: path
          required: true
          description: Token.uid of the Token to authorize.
          schema:
            type: string
            maxLength: 36
        - name: type
          in: query
          required: false
          description: Token.type of the Token to authorize. Default if omitted is RFID.
          schema:
            $ref: "#/components/schemas/TokenType"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationReferences"
      responses:
        "200":
          description: Authorization result.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            X-Correlation-ID:
              $ref: "#/components/headers/X-Correlation-ID"
            OCPI-from-country-code:
              $ref: "#/components/headers/OCPI-from-country-code"
            OCPI-from-party-id:
              $ref: "#/components/headers/OCPI-from-party-id"
            OCPI-to-country-code:
              $ref: "#/components/headers/OCPI-to-country-code"
            OCPI-to-party-id:
              $ref: "#/components/headers/OCPI-to-party-id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationInfoResponse"
        "400":
          $ref: "#/components/responses/OcpiBadRequestResponse"
        "401":
          $ref: "#/components/responses/OcpiUnauthorizedResponse"
        "404":
          $ref: "#/components/responses/OcpiNotFoundResponse"
    parameters:
      - $ref: "#/components/parameters/X-Request-ID"
      - $ref: "#/components/parameters/X-Correlation-ID"
      - $ref: "#/components/parameters/OCPI-from-country-code"
      - $ref: "#/components/parameters/OCPI-from-party-id"
      - $ref: "#/components/parameters/OCPI-to-country-code"
      - $ref: "#/components/parameters/OCPI-to-party-id"
  /tokens/{country_code}/{party_id}/{token_uid}:
    get:
      operationId: getReceiverToken
      summary: Get Token (Receiver)
      description: Retrieve a Token object as stored in the Receiver's system.
      tags:
        - Tokens - Receiver
      parameters:
        - $ref: "#/components/parameters/country_code"
        - $ref: "#/components/parameters/party_id"
        - name: token_uid
          in: path
          required: true
          description: Token.uid of the Token to retrieve.
          schema:
            type: string
            maxLength: 36
        - name: type
          in: query
          required: false
          description: Token.type of the Token to retrieve. Default if omitted is RFID.
          schema:
            $ref: "#/components/schemas/TokenType"
      responses:
        "200":
          description: The requested Token object.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            X-Correlation-ID:
              $ref: "#/components/headers/X-Correlation-ID"
            OCPI-from-country-code:
              $ref: "#/components/headers/OCPI-from-country-code"
            OCPI-from-party-id:
              $ref: "#/components/headers/OCPI-from-party-id"
            OCPI-to-country-code:
              $ref: "#/components/headers/OCPI-to-country-code"
            OCPI-to-party-id:
              $ref: "#/components/headers/OCPI-to-party-id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/OcpiBadRequestResponse"
        "401":
          $ref: "#/components/responses/OcpiUnauthorizedResponse"
        "404":
          $ref: "#/components/responses/OcpiNotFoundResponse"
    put:
      operationId: putReceiverToken
      summary: Push Token (Receiver)
      description: Push a new or updated Token object to the Receiver. URL parameters
        country_code and party_id SHALL match the corresponding values in the
        Token object.
      tags:
        - Tokens - Receiver
      parameters:
        - $ref: "#/components/parameters/country_code"
        - $ref: "#/components/parameters/party_id"
        - name: token_uid
          in: path
          required: true
          schema:
            type: string
            maxLength: 36
        - name: type
          in: query
          required: false
          description: Token.type of the Token. Default if omitted is RFID.
          schema:
            $ref: "#/components/schemas/TokenType"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Token"
            example:
              country_code: DE
              party_id: TNM
              uid: "12345678905880"
              type: RFID
              contract_id: DE8ACC12E46L89
              visual_number: DF000-2001-8999-1
              issuer: TheNewMotion
              group_id: DF000-2001-8999
              valid: true
              whitelist: ALLOWED
              language: it
              default_profile_type: GREEN
              energy_contract:
                supplier_name: Greenpeace Energy eG
                contract_id: "0123456789"
              last_updated: 2018-12-10T17:25:10Z
      responses:
        "200":
          description: Token updated.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            X-Correlation-ID:
              $ref: "#/components/headers/X-Correlation-ID"
            OCPI-from-country-code:
              $ref: "#/components/headers/OCPI-from-country-code"
            OCPI-from-party-id:
              $ref: "#/components/headers/OCPI-from-party-id"
            OCPI-to-country-code:
              $ref: "#/components/headers/OCPI-to-country-code"
            OCPI-to-party-id:
              $ref: "#/components/headers/OCPI-to-party-id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OcpiResponse"
        "201":
          description: Token created.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            X-Correlation-ID:
              $ref: "#/components/headers/X-Correlation-ID"
            OCPI-from-country-code:
              $ref: "#/components/headers/OCPI-from-country-code"
            OCPI-from-party-id:
              $ref: "#/components/headers/OCPI-from-party-id"
            OCPI-to-country-code:
              $ref: "#/components/headers/OCPI-to-country-code"
            OCPI-to-party-id:
              $ref: "#/components/headers/OCPI-to-party-id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OcpiResponse"
        "400":
          $ref: "#/components/responses/OcpiBadRequestResponse"
        "401":
          $ref: "#/components/responses/OcpiUnauthorizedResponse"
    patch:
      operationId: patchReceiverToken
      summary: Partially Update Token (Receiver)
      description: Push partial updates to a Token. Only fields that need to be
        updated have to be present, fields not specified are considered
        unchanged. The request MUST contain last_updated. Tokens cannot be
        deleted; use PUT or PATCH to invalidate.
      tags:
        - Tokens - Receiver
      parameters:
        - $ref: "#/components/parameters/country_code"
        - $ref: "#/components/parameters/party_id"
        - name: token_uid
          in: path
          required: true
          schema:
            type: string
            maxLength: 36
        - name: type
          in: query
          required: false
          description: Token.type of the Token. Default if omitted is RFID.
          schema:
            $ref: "#/components/schemas/TokenType"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenPatch"
            example:
              valid: false
              last_updated: 2018-12-10T17:25:10Z
      responses:
        "200":
          description: Token partially updated.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
            X-Correlation-ID:
              $ref: "#/components/headers/X-Correlation-ID"
            OCPI-from-country-code:
              $ref: "#/components/headers/OCPI-from-country-code"
            OCPI-from-party-id:
              $ref: "#/components/headers/OCPI-from-party-id"
            OCPI-to-country-code:
              $ref: "#/components/headers/OCPI-to-country-code"
            OCPI-to-party-id:
              $ref: "#/components/headers/OCPI-to-party-id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OcpiResponse"
        "400":
          $ref: "#/components/responses/OcpiBadRequestResponse"
        "401":
          $ref: "#/components/responses/OcpiUnauthorizedResponse"
        "404":
          $ref: "#/components/responses/OcpiNotFoundResponse"
    parameters:
      - $ref: "#/components/parameters/X-Request-ID"
      - $ref: "#/components/parameters/X-Correlation-ID"
      - $ref: "#/components/parameters/OCPI-from-country-code"
      - $ref: "#/components/parameters/OCPI-from-party-id"
      - $ref: "#/components/parameters/OCPI-to-country-code"
      - $ref: "#/components/parameters/OCPI-to-party-id"
  /versions:
    parameters:
