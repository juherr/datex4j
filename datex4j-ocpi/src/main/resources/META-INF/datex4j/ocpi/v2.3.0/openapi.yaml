components:
  securitySchemes:
    TokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: OCPI credentials token passed as `Token
        <base64-encoded-credentials-token>` in the Authorization header.
  parameters:
    X-Request-ID:
      name: X-Request-ID
      in: header
      required: true
      description: Every request SHALL contain a unique request ID. The response to
        this request SHALL contain the same ID.
      schema:
        type: string
      example: f5be3127-a31e-4e8c-84c3-0e4c89a48d71
    X-Correlation-ID:
      name: X-Correlation-ID
      in: header
      required: true
      description: Every request/response SHALL contain a unique correlation ID. Every
        response to this request SHALL contain the same ID.
      schema:
        type: string
      example: 9d863a1c-e981-4fc1-b3be-8c39ec35bc38
    OCPI-from-country-code:
      name: OCPI-from-country-code
      in: header
      required: false
      description: ISO-3166 alpha-2 country code of the party this message is sent
        from. Required for Functional Modules when routing via Hub or Platform.
      schema:
        type: string
        minLength: 2
        maxLength: 2
    OCPI-from-party-id:
      name: OCPI-from-party-id
      in: header
      required: false
      description: Party ID of the connected party this message is sent from. Required
        for Functional Modules when routing via Hub or Platform.
      schema:
        type: string
        minLength: 3
        maxLength: 3
    OCPI-to-country-code:
      name: OCPI-to-country-code
      in: header
      required: false
      description: ISO-3166 alpha-2 country code of the party this message is to be
        sent to. Required for Functional Modules when routing via Hub or
        Platform. Can be omitted for Open Routing Requests.
      schema:
        type: string
        minLength: 2
        maxLength: 2
    OCPI-to-party-id:
      name: OCPI-to-party-id
      in: header
      required: false
      description: Party ID of the connected party this message is to be sent to.
        Required for Functional Modules when routing via Hub or Platform. Can be
        omitted for Open Routing Requests.
      schema:
        type: string
        minLength: 3
        maxLength: 3
    date_from:
      name: date_from
      in: query
      required: false
      description: Only return objects that have last_updated after or equal to this
        Date/Time (inclusive).
      schema:
        $ref: "#/components/schemas/DateTime"
    date_to:
      name: date_to
      in: query
      required: false
      description: Only return objects that have last_updated up to this Date/Time,
        but not including (exclusive).
      schema:
        $ref: "#/components/schemas/DateTime"
    offset:
      name: offset
      in: query
      required: false
      description: The offset of the first object returned. Default is 0.
      schema:
        type: integer
        minimum: 0
        default: 0
    limit:
      name: limit
      in: query
      required: false
      description: Maximum number of objects to GET. The server might return fewer objects.
      schema:
        type: integer
        minimum: 1
    country_code:
      name: country_code
      in: path
      required: true
      description: ISO-3166 alpha-2 country code of the party that owns the object.
      schema:
        type: string
        minLength: 2
        maxLength: 2
    party_id:
      name: party_id
      in: path
      required: true
      description: Party ID (Provider ID) of the party that owns the object.
      schema:
        type: string
        minLength: 3
        maxLength: 3
  schemas:
    DateTime:
      type: string
      maxLength: 25
      pattern: ^\d{4}-\d{2}-\d{2}T(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?Z?$
      description: Timestamp formatted as an OCPI-restricted RFC 3339 string in UTC.
        The UTC designator Z is optional, fractional seconds MAY be used, and
        offsets such as +00:00 are not allowed.
      example: 2024-01-15T10:30:00Z
    TokenType:
      anyOf:
        - type: string
          enum:
            - AD_HOC_USER
            - APP_USER
            - EMAID
            - OTHER
            - RFID
        - type: string
      description: Type of charging token.
      x-enumDescriptions:
        AD_HOC_USER: One time use Token ID generated by a server (or App.) The eMSP uses
          this to bind a Session to a customer, probably an app user.
        APP_USER: Token ID generated by a server (or App.) to identify a user of an App.
          The same user uses the same Token for every Session.
        EMAID: An EMAID. EMAIDs are used as Tokens when the Charging Station and the
          vehicle are using ISO 15118 for communication.
        OTHER: Other type of token
        RFID: RFID Token
    CdrToken:
      type: object
      description: Identifies the token used to start a charging session in a CDR.
      required:
        - country_code
        - party_id
        - uid
        - type
        - contract_id
      properties:
        country_code:
          type: string
          minLength: 2
          maxLength: 2
          description: ISO-3166 alpha-2 country code of the eMSP that owns this Token.
        party_id:
          type: string
          minLength: 3
          maxLength: 3
          description: ID of the eMSP that owns this Token.
        uid:
          type: string
          maxLength: 36
          description: Unique ID by which this Token can be identified.
        type:
          $ref: "#/components/schemas/TokenType"
        contract_id:
          type: string
          maxLength: 36
          description: Uniquely identifies the EV driver contract token within the eMSP's
            platform.
      additionalProperties: true
    AuthMethod:
      type: string
      enum:
        - AUTH_REQUEST
        - COMMAND
        - WHITELIST
      description: Method used to authenticate a charging session.
      x-enumDescriptions:
        AUTH_REQUEST: Authentication request has been sent to the eMSP.
        COMMAND: Command like StartSession or ReserveNow used to start the Session, the
          Token provided in the Command was used as authorization.
        WHITELIST: Whitelist used for authentication, no request to the eMSP has been
          performed.
    GeoLocation:
      type: object
      description: Geographic coordinates (WGS 84).
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: string
          maxLength: 11
          description: Latitude in decimal degree (e.g. "50.770774").
          pattern: ^-?[0-9]{1,2}\.[0-9]{5,7}$
        longitude:
          type: string
          maxLength: 12
          description: Longitude in decimal degree (e.g. "-126.104965").
          pattern: ^-?[0-9]{1,3}\.[0-9]{5,7}$
