    ChargingProfileResponseType:
      type: string
      enum:
        - ACCEPTED
        - NOT_SUPPORTED
        - REJECTED
        - TOO_OFTEN
        - UNKNOWN_SESSION
      description: Response from CPO on a charging profile request.
      x-enumDescriptions:
        ACCEPTED: ChargingProfile request accepted by the CPO, request will be forwarded
          to the EVSE.
        NOT_SUPPORTED: The ChargingProfiles not supported by this CPO, Charge Point, EVSE etc.
        REJECTED: ChargingProfile request rejected by the CPO. (Session might not be
          from a customer of the eMSP that sent this request)
        TOO_OFTEN: ChargingProfile request rejected by the CPO, requests are sent more
          often than allowed.
        UNKNOWN_SESSION: The Session in the requested command is not known by this CPO.
    ChargingProfileResponse:
      type: object
      description: Immediate response from CPO indicating whether the request was forwarded.
