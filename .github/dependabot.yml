version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      maven-plugins:
        patterns:
          - "*maven-plugin*"
          - "org.apache.maven.plugins:*"
      test-dependencies:
        patterns:
          - "org.junit*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
